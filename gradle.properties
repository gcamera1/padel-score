# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Padel Score version
# versionName is shared; versionCode is per-module (Play requires a distinct
# versionCode per bundle for phone + wear, and recommends phone > wear).
# 9-digit scheme: [targetSdk 2][commercial version 3][build 2][form factor 2]
#   mobile: 36 · 011 · 01 · 00  -> 360110100
#   wear:   35 · 011 · 02 · 03  -> 350110203
# El build del reloj va en 02: el 00 (350110003) es el bundle que Play rechazó por WO-V1
# (texto cortado con fuente grande) y el 01 (350110103) es el aprobado el 11/08/2026. El 02
# arregla el partido duplicado y su duración.
# El build de mobile va en 01: el 00 (360110000) se compiló y archivó pero nunca se subió,
# porque entró el bloque de reglas del texto de compartir. Se bumpea para que no queden dos
# artefactos distintos con el mismo versionCode.
#
# El versionName sigue en 1.1.0 a propósito: es compartido por los dos módulos y mobile
# 360110100 está en revisión con ese nombre. Subirlo a 1.1.1 por un bugfix del reloj
# obligaría a que el próximo bundle del teléfono también saliera como 1.1.1 sin haber
# cambiado. El versionCode ya distingue los builds.
PADEL_MOBILE_VERSION_CODE=360120000
PADEL_WEAR_VERSION_CODE=350110203
PADEL_VERSION_NAME=1.2.0

# AGP 8.5.2 se probó hasta compileSdk 34; suprimimos el warning al usar 35 (:wear) y 36 (:mobile).
android.suppressUnsupportedCompileSdk=35,36